name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # internal/crypto binds libsecp256k1 via cgo (ECDSA / Schnorr /
      # BIP-324 ElligatorSwift). Ubuntu's libsecp256k1-dev predates the
      # ellswift module (no secp256k1_ellswift.h), so build it from source.
      - name: Build libsecp256k1 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config git
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libsecp256k1 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config git
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libsecp256k1 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config git
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: blockbrew:${{ github.sha }}
