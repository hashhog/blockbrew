name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          # darwin targets removed: internal/crypto binds libsecp256k1 via
          # cgo (ellswift / ECDSA / schnorr), so CGO_ENABLED=0 cross-builds
          # fail to compile. Re-add with an osxcross toolchain + darwin
          # libsecp256k1 if desktop releases are needed.
    steps:
      - uses: actions/checkout@v4
      # Same as ci.yml: Ubuntu's libsecp256k1-dev lacks secp256k1_ellswift.h;
      # build v0.7.1 from source.
      - name: Build libsecp256k1 from source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config git
          git clone --depth 1 --branch v0.7.1 https://github.com/bitcoin-core/secp256k1 /tmp/secp256k1
          cd /tmp/secp256k1
          ./autogen.sh
          ./configure
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o blockbrew-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/blockbrew
      - uses: actions/upload-artifact@v4
        with:
          name: blockbrew-${{ matrix.goos }}-${{ matrix.goarch }}
          path: blockbrew-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
